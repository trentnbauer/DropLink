<main id="app" data-view="start" data-pane="thread">

  <section id="v-start" class="view start">
    <div class="brand"><span class="logo"><svg class="i" aria-hidden="true"><use href="#i-arrows-left-right"/></svg></span><span class="brand-name">DropLink</span></div>
    <div class="hero">
      <h1 class="redact" data-redact="Pass things between devices. Directly."></h1>
      <p class="sub redact" data-redact="Peer-to-peer over WebRTC. Nothing is uploaded or stored." data-offset="1400"></p>
    </div>
    <div class="field">
      <label for="name">Your name</label>
      <div class="input"><svg class="i" aria-hidden="true"><use href="#i-user"/></svg><input id="name" maxlength="24" autocomplete="nickname" spellcheck="false"></div>
    </div>
    <button id="host" class="btn primary"><svg class="i" aria-hidden="true"><use href="#i-plus-circle"/></svg>Start a room</button>
    <div class="or"><span>or join one</span></div>
    <div class="join">
      <div class="code-grid" role="group" aria-label="Room code"><input class="cell" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" aria-label="Room code character 1"><input class="cell" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" aria-label="Room code character 2"><input class="cell" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" aria-label="Room code character 3"><div class="dash"></div><input class="cell" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" aria-label="Room code character 4"><input class="cell" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" aria-label="Room code character 5"><input class="cell" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" aria-label="Room code character 6"></div>
      <div class="hint">Letters and numbers, not case-sensitive</div>
      <button id="join" class="btn" disabled>Connect<svg class="i" aria-hidden="true"><use href="#i-arrow-right"/></svg></button>
      <p id="status" class="status" role="status"></p>
    </div>
    <footer class="foot"><svg class="i" aria-hidden="true"><use href="#i-lock-simple"/></svg><span class="redact" data-redact="End-to-end, device to device. Up to 8 people." data-offset="2600"></span></footer>
  </section>

  <section id="v-knock" class="view knock" hidden>
    <div class="knock-av" id="knock-av"></div>
    <h2>Knocking on <span id="knock-code" class="mono"></span></h2>
    <p class="muted">The host needs to let you in. Keep this screen open.</p>
    <button id="knock-cancel" class="btn">Cancel</button>
  </section>

  <section id="v-room" class="view room" hidden>
    <aside class="side">
      <div class="lobby-top">
        <span class="open"><i class="dot"></i><span class="redact" data-redact="Room open" data-offset="900"></span></span>
        <button id="leave-m" class="ghost"><svg class="i" aria-hidden="true"><use href="#i-sign-out"/></svg><span id="leave-m-t">Close</span></button>
      </div>
      <div class="brand desk"><span class="logo"><svg class="i" aria-hidden="true"><use href="#i-arrows-left-right"/></svg></span><span class="brand-name">DropLink</span></div>
      <div class="codeblock">
        <div class="label">Room code</div>
        <div class="code-row">
          <div id="room-code" class="room-code"></div>
          <button id="copy-code-m" class="icon-btn mob" aria-label="Copy room code"><svg class="i" aria-hidden="true"><use href="#i-copy"/></svg></button>
        </div>
        <div id="phonetic" class="phon"></div>
        <button id="copy-code-d" class="btn sm desk"><svg class="i" aria-hidden="true"><use href="#i-copy"/></svg><span>Copy code</span></button>
      </div>
      <div id="req-wrap" hidden>
        <div class="sec-head"><span>Wants to join</span><span id="req-n"></span></div>
        <div id="req-list" class="list"></div>
      </div>
      <div>
        <div class="sec-head"><span>In the room</span><span id="mem-n"></span></div>
        <ul id="mem-list" class="list"></ul>
      </div>
      <label id="auto-wrap" class="auto" hidden><input type="checkbox" id="auto"><span>Let people in without asking</span></label>
      <div class="side-foot">
        <button id="to-thread" class="btn mob">Back to thread<svg class="i" aria-hidden="true"><use href="#i-arrow-right"/></svg></button>
        <button id="leave-d" class="btn desk"><svg class="i" aria-hidden="true"><use href="#i-sign-out"/></svg><span id="leave-d-t">Close room</span></button>
      </div>
    </aside>

    <section class="main">
      <header class="head-m">
        <div class="head-row">
          <button id="head-code" class="head-code" aria-label="Room details"></button>
          <button id="badge" class="btn sm" hidden></button>
          <button id="leave-t" class="icon-btn" aria-label="Leave room"><svg class="i" aria-hidden="true"><use href="#i-sign-out"/></svg></button>
        </div>
        <div id="chips" class="chips"></div>
      </header>
      <header class="head-d">
        <h2 class="redact" data-redact="Room thread" data-offset="500"></h2>
        <span class="direct"><svg class="i" aria-hidden="true"><use href="#i-lock-simple"/></svg><span class="redact" data-redact="Direct · nothing leaves these devices" data-offset="1800"></span></span>
      </header>
      <div id="thread" class="thread" aria-live="polite"></div>
      <form id="composer" class="composer" autocomplete="off">
        <button type="button" id="attach" class="attach" aria-label="Attach files"><svg class="i m" aria-hidden="true"><use href="#i-plus"/></svg><svg class="i d" aria-hidden="true"><use href="#i-paperclip"/></svg><span>Attach</span></button>
        <input id="files" type="file" multiple hidden>
        <div class="pill">
          <textarea id="text" rows="1" aria-label="Message"></textarea>
          <button type="submit" id="send" class="send" aria-label="Send"><svg class="i" aria-hidden="true"><use href="#i-arrow-up"/></svg></button>
        </div>
      </form>
      <div id="drop" class="drop" hidden><svg class="i" aria-hidden="true"><use href="#i-tray-arrow-down"/></svg><span>Drop to send to everyone</span></div>
    </section>
  </section>

</main>
<script src="vendor/peerjs.min.js"></script>
<script src="app.js"></script>
</body>
</html>
