name: Build image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag and release the version
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to work out the next version

      # push to main -> next version (0.3.0, 0.3.1, ...), release tag vX.Y.Z -> that version, otherwise dev-<sha>
      - id: ver
        run: ./scripts/next-version.sh "${{ github.event_name }}" "${{ github.ref_type }}" "${{ github.ref_name }}" "${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/droplink
          flavor: latest=false
          labels: |
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ !startsWith(steps.ver.outputs.version, 'dev-') }}
            type=raw,value=${{ steps.ver.outputs.minor }},enable=${{ steps.ver.outputs.stable == 'true' }}
            type=raw,value=${{ steps.ver.outputs.major }},enable=${{ steps.ver.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ steps.ver.outputs.stable == 'true' }}
            type=sha,format=short,enable=${{ github.ref_type != 'tag' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only after the image is published, so a tag never points at a version that failed to build.
      - name: Tag and release the version
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ steps.ver.outputs.version }}" --target "${{ github.sha }}" --title "v${{ steps.ver.outputs.version }}" --generate-notes
